[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentflow-agents"
version = "0.1.0"
description = "Nebula — Multi-agent AI governance system"
requires-python = ">=3.12"
dependencies = [
    # Agent framework
    "google-adk>=1.0.0",
    # Observability / tracing
    "langfuse>=2.0.0",
    # Experiment tracking
    "mlflow>=2.0.0",
    # Annotation platform
    "label-studio-sdk>=1.0.0",
    # MCP server
    "mcp[cli]>=1.0.0",
    # Data validation
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # HTTP client
    "httpx>=0.27.0",
    # Statistical anomaly detection
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    # Env management
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "mcp_server*", "orchestrator*", "shared*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
